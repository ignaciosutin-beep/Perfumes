<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfumes</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card-border:#262b35; --text:#f3f4f6;
    --muted:#9ca3af; --accent:#d4af6a; --accent-soft:#3a2f1c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,0.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--card-border);padding:16px 20px;}
  h1{margin:0 0 12px 0;font-size:1.5rem;letter-spacing:0.5px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;}
  input[type=text], select{
    background:var(--card);border:1px solid var(--card-border);color:var(--text);
    padding:10px 12px;border-radius:8px;font-size:0.95rem;
  }
  input[type=text]{flex:1;min-width:180px;}
  #popularFilter{min-width:170px;}
  .count{color:var(--muted);font-size:0.85rem;margin-top:8px;}
  main{padding:20px;max-width:1200px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;gap:6px;}
  .card-body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .inspired{color:var(--muted);font-size:0.78rem;font-style:italic;}
  .inspired b{color:var(--text);font-style:normal;}
  .brand{color:var(--accent);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}
  .name{font-size:0.98rem;font-weight:600;line-height:1.3;min-height:2.5em;}
  .meta{color:var(--muted);font-size:0.82rem;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-size:0.72rem;}
  .tag.popular{background:#1c3a2e;color:#6fcf97;}
  .price{margin-top:auto;font-size:1.15rem;font-weight:700;color:#fff;padding-top:6px;}
  footer{text-align:center;color:var(--muted);font-size:0.8rem;padding:30px 20px;}
  .empty{color:var(--muted);text-align:center;padding:60px 20px;}

  @media (max-width: 480px){
    header{padding:12px 14px;}
    h1{font-size:1.2rem;margin-bottom:8px;}
    main{padding:10px;}
    .grid{grid-template-columns:repeat(2, 1fr);gap:8px;}
    .card-body{padding:9px;gap:4px;}
    .name{font-size:0.78rem;min-height:2.1em;line-height:1.25;}
    .brand{font-size:0.62rem;}
    .meta{font-size:0.68rem;gap:4px;}
    .tag{padding:1px 5px;font-size:0.62rem;}
    .price{font-size:0.95rem;}
    .add-btn{padding:7px 0;font-size:0.75rem;}
    .cart-fab{padding:11px 16px;font-size:0.85rem;bottom:14px;right:14px;}
    .inspired{font-size:0.68rem;}
  }

  .add-btn{margin-top:8px;background:var(--accent);color:#1a1a1a;border:none;border-radius:8px;padding:9px 0;font-weight:700;font-size:0.85rem;cursor:pointer;}
  .add-btn:active{opacity:0.8;}

  .cart-fab{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#1a1a1a;border:none;border-radius:50px;padding:14px 20px;font-weight:700;font-size:0.95rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.4);z-index:20;}
  .cart-badge{background:#1a1a1a;color:var(--accent);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:0.75rem;margin-left:8px;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:30;padding:16px;}
  .overlay.open{display:flex;}
  .panel{background:var(--card);border:1px solid var(--card-border);border-radius:14px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;}
  .panel h2{margin:0 0 14px 0;font-size:1.2rem;}
  .cart-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--card-border);}
  .cart-line-name{font-size:0.9rem;flex:1;}
  .cart-line-sub{color:var(--muted);font-size:0.78rem;}
  .qty-controls{display:flex;align-items:center;gap:8px;}
  .qty-controls button{background:var(--accent-soft);color:var(--accent);border:none;border-radius:6px;width:26px;height:26px;font-size:1rem;cursor:pointer;}
  .cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-top:14px;padding-top:14px;border-top:1px solid var(--card-border);}
  .panel-actions{display:flex;gap:10px;margin-top:16px;}
  .panel-actions button{flex:1;padding:11px 0;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-size:0.9rem;}
  .btn-primary{background:var(--accent);color:#1a1a1a;}
  .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--card-border) !important;}
  .panel input[type=text]{width:100%;margin-bottom:12px;}
  .cart-empty-msg{color:var(--muted);text-align:center;padding:30px 0;}
  .confirm-msg{text-align:center;padding:20px 0;color:#6fcf97;font-weight:600;}
</style>
</head>
<body>
<header>
  <h1>Perfumes</h1>
  <div class="controls">
    <input type="text" id="search" placeholder="Buscar perfume o marca...">
    <select id="brand"><option value="">Todas las marcas</option></select>
    <select id="popularFilter">
      <option value="">Todos los productos</option>
      <option value="popular">Solo vendidos antes</option>
    </select>
    <select id="inspiredFilter">
      <option value="">Con o sin inspiración</option>
      <option value="inspired">Solo "se parece a..."</option>
    </select>
    <select id="sortOrder">
      <option value="">Sin orden</option>
      <option value="asc">Precio: menor a mayor</option>
      <option value="desc">Precio: mayor a menor</option>
    </select>
  </div>
  <div class="count" id="count"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No se encontraron resultados.</div>
</main>
<footer>Catálogo actualizado periódicamente. Precios en pesos argentinos.</footer>

<button class="cart-fab" id="cartFab">🛒 Carrito<span class="cart-badge" id="cartBadge">0</span></button>

<div class="overlay" id="cartOverlay">
  <div class="panel" id="cartPanel">
    <h2>Tu pedido</h2>
    <div id="cartLines"></div>
    <div class="cart-total" id="cartTotal" style="display:none;">
      <span>Total</span><span id="cartTotalAmount"></span>
    </div>
    <div class="panel-actions" id="cartActionsToForm" style="display:none;">
      <button class="btn-secondary" id="cartCloseBtn">Seguir viendo</button>
      <button class="btn-primary" id="cartGoToFormBtn">Confirmar pedido</button>
    </div>
    <div class="panel-actions" id="cartActionsEmpty">
      <button class="btn-secondary" id="cartCloseBtn2">Cerrar</button>
    </div>
  </div>
</div>

<div class="overlay" id="formOverlay">
  <div class="panel">
    <h2>Confirmar pedido</h2>
    <input type="text" id="nombreApellido" placeholder="Nombre y apellido">
    <div class="panel-actions">
      <button class="btn-secondary" id="formBackBtn">Volver</button>
      <button class="btn-primary" id="formSubmitBtn">Enviar pedido</button>
    </div>
  </div>
</div>

<div class="overlay" id="thanksOverlay">
  <div class="panel">
    <div class="confirm-msg" id="thanksMsg">¡Pedido enviado! Te vamos a contactar para coordinar.</div>
    <div class="panel-actions">
      <button class="btn-primary" id="thanksCloseBtn">Cerrar</button>
    </div>
  </div>
</div>

<script>
// Reemplazar por la URL de tu Google Apps Script Web App (termina en /exec)
const CART_ENDPOINT = "https://script.google.com/macros/s/AKfycbw5xMe46kNvMs2SYm0fgMtBM57ewSeu3-xID6p5QIdXmOtsRZaMQCX6LKxJBpdXi0Kc/exec";

const fmt = new Intl.NumberFormat('es-AR');

let ITEMS = [];

function renderBrandOptions(items){
  const sel = document.getElementById('brand');
  const brands = [...new Set(items.map(i => i.section))].sort();
  for(const b of brands){
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    sel.appendChild(opt);
  }
}

function cleanName(name){
  return name.replace(/\(CAJA TESTER\)/i,'').replace(/\(TESTER SIN CAJA\)/i,'').trim();
}

// Título corto para la tarjeta: saca concentración, tamaño y, si dice "BY <marca>",
// usa esa marca para mostrar en vez de la sección del PDF. El nombre completo
// (it.name) sigue siendo el que se manda al carrito / Google Sheets, sin tocar.
function shortTitle(it){
  let s = cleanName(it.name);
  let brandOverride = null;

  const byMatch = s.match(/\bBY\s+([A-ZÀ-Ü0-9&.'´\- ]+?)(\s+(EDP|EDT|EDC|EDY|PARFUM|EXTRAIT).*|\s*\(.*\)|\s*\d.*)?$/i);
  if(byMatch && byMatch[1] && byMatch[1].trim().length > 1){
    brandOverride = byMatch[1].trim();
    s = s.slice(0, byMatch.index).trim();
  }

  s = s.replace(/\b(EXTRAIT DE PARFUM|EXTRAIT|PARFUM|EDP|EDT|EDC|EDY)\b/gi, ' ');
  s = s.replace(/\d+(\.\d+)?\s*ML\b/gi, ' ');
  s = s.replace(/\s{2,}/g, ' ').trim();
  s = s.replace(/[-,]+$/, '').trim();

  if(!s) s = cleanName(it.name); // fallback si quedó vacío

  return { title: s, brandOverride };
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const brand = document.getElementById('brand').value;
  const popularOnly = document.getElementById('popularFilter').value === 'popular';
  const inspiredOnly = document.getElementById('inspiredFilter').value === 'inspired';
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';

  const sortOrder = document.getElementById('sortOrder').value;

  const filtered = ITEMS.filter(it => {
    if(brand && it.section !== brand) return false;
    if(popularOnly && !(it.veces_vendido > 0)) return false;
    if(inspiredOnly && !it.inspirado_en) return false;
    if(q && !(it.name.toLowerCase().includes(q) || it.section.toLowerCase().includes(q) || (it.inspirado_en && it.inspirado_en.toLowerCase().includes(q)))) return false;
    return true;
  });

  if(sortOrder === 'asc'){
    filtered.sort((a,b) => a.ars - b.ars);
  } else if(sortOrder === 'desc'){
    filtered.sort((a,b) => b.ars - a.ars);
  }

  document.getElementById('count').textContent = filtered.length + ' productos';
  empty.style.display = filtered.length ? 'none' : 'block';

  const frag = document.createDocumentFragment();
  for(const it of filtered){
    const card = document.createElement('div');
    card.className = 'card';

    const body = document.createElement('div');
    body.className = 'card-body';

    const { title, brandOverride } = shortTitle(it);

    const brandEl = document.createElement('div');
    brandEl.className = 'brand';
    brandEl.textContent = brandOverride || it.section;

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = title;
    nameEl.title = cleanName(it.name); // nombre completo al pasar el mouse

    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    if(it.concentracion){
      const t = document.createElement('span'); t.className='tag'; t.textContent = it.concentracion;
      metaEl.appendChild(t);
    }
    if(it.ml){
      const t = document.createElement('span'); t.className='tag'; t.textContent = it.ml + ' ml';
      metaEl.appendChild(t);
    }
    if(it.kit){
      const t = document.createElement('span'); t.className='tag'; t.textContent = 'Kit';
      metaEl.appendChild(t);
    }
    if(it.tester){
      const t = document.createElement('span'); t.className='tag'; t.textContent = 'Tester';
      metaEl.appendChild(t);
    }
    if(it.veces_vendido && it.veces_vendido > 0){
      const t = document.createElement('span'); t.className='tag popular'; t.textContent = 'Vendido antes';
      metaEl.appendChild(t);
    }

    const priceEl = document.createElement('div');
    priceEl.className = 'price';
    priceEl.textContent = '$' + fmt.format(it.ars);

    body.appendChild(brandEl);
    body.appendChild(nameEl);
    body.appendChild(metaEl);
    if(it.inspirado_en){
      const insp = document.createElement('div');
      insp.className = 'inspired';
      insp.innerHTML = 'Se parece a: <b>' + it.inspirado_en + '</b>';
      body.appendChild(insp);
    }
    body.appendChild(priceEl);

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.textContent = 'Agregar al pedido';
    addBtn.addEventListener('click', () => addToCart(it));
    body.appendChild(addBtn);

    card.appendChild(body);
    frag.appendChild(card);
  }
  grid.appendChild(frag);
}

fetch('data/catalog.json')
  .then(r => r.json())
  .then(data => {
    ITEMS = data;
    renderBrandOptions(ITEMS);
    render();
  })
  .catch(err => {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent = 'No se pudo cargar el catálogo.';
  });

document.getElementById('search').addEventListener('input', render);
document.getElementById('brand').addEventListener('change', render);
document.getElementById('popularFilter').addEventListener('change', render);
document.getElementById('inspiredFilter').addEventListener('change', render);
document.getElementById('sortOrder').addEventListener('change', render);

// ---------- Carrito ----------
let CART = [];

function loadCart(){
  try{
    const raw = localStorage.getItem('perfumes_cart');
    CART = raw ? JSON.parse(raw) : [];
  }catch(e){ CART = []; }
}
function saveCart(){
  try{ localStorage.setItem('perfumes_cart', JSON.stringify(CART)); }catch(e){}
}

function addToCart(it){
  const existing = CART.find(c => c.section === it.section && c.name === it.name);
  if(existing){
    existing.cantidad += 1;
  } else {
    CART.push({ section: it.section, name: it.name, ars: it.ars, cantidad: 1 });
  }
  saveCart();
  updateCartBadge();
}

function removeFromCart(idx){
  CART.splice(idx, 1);
  saveCart();
  updateCartBadge();
  renderCartPanel();
}

function changeQty(idx, delta){
  CART[idx].cantidad += delta;
  if(CART[idx].cantidad <= 0){
    removeFromCart(idx);
    return;
  }
  saveCart();
  updateCartBadge();
  renderCartPanel();
}

function updateCartBadge(){
  const total = CART.reduce((s,c) => s + c.cantidad, 0);
  document.getElementById('cartBadge').textContent = total;
}

function renderCartPanel(){
  const linesEl = document.getElementById('cartLines');
  const totalEl = document.getElementById('cartTotal');
  const actionsToForm = document.getElementById('cartActionsToForm');
  const actionsEmpty = document.getElementById('cartActionsEmpty');
  linesEl.innerHTML = '';

  if(CART.length === 0){
    linesEl.innerHTML = '<div class="cart-empty-msg">Todavía no agregaste productos.</div>';
    totalEl.style.display = 'none';
    actionsToForm.style.display = 'none';
    actionsEmpty.style.display = 'flex';
    return;
  }

  actionsToForm.style.display = 'flex';
  actionsEmpty.style.display = 'none';

  let total = 0;
  CART.forEach((c, idx) => {
    total += c.ars * c.cantidad;
    const line = document.createElement('div');
    line.className = 'cart-line';
    line.innerHTML = `
      <div class="cart-line-name">${cleanName(c.name)}<div class="cart-line-sub">$${fmt.format(c.ars)} c/u</div></div>
      <div class="qty-controls">
        <button data-action="minus">-</button>
        <span>${c.cantidad}</span>
        <button data-action="plus">+</button>
      </div>
    `;
    line.querySelector('[data-action="minus"]').addEventListener('click', () => changeQty(idx, -1));
    line.querySelector('[data-action="plus"]').addEventListener('click', () => changeQty(idx, 1));
    linesEl.appendChild(line);
  });

  totalEl.style.display = 'flex';
  document.getElementById('cartTotalAmount').textContent = '$' + fmt.format(total);
}

function openOverlay(id){ document.getElementById(id).classList.add('open'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('open'); }

document.getElementById('cartFab').addEventListener('click', () => {
  renderCartPanel();
  openOverlay('cartOverlay');
});
document.getElementById('cartCloseBtn').addEventListener('click', () => closeOverlay('cartOverlay'));
document.getElementById('cartCloseBtn2').addEventListener('click', () => closeOverlay('cartOverlay'));
document.getElementById('cartGoToFormBtn').addEventListener('click', () => {
  closeOverlay('cartOverlay');
  openOverlay('formOverlay');
});
document.getElementById('formBackBtn').addEventListener('click', () => {
  closeOverlay('formOverlay');
  openOverlay('cartOverlay');
});

document.getElementById('formSubmitBtn').addEventListener('click', async () => {
  const nombre = document.getElementById('nombreApellido').value.trim();
  if(!nombre){
    alert('Ingresá tu nombre y apellido para confirmar el pedido.');
    return;
  }
  const submitBtn = document.getElementById('formSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  const payload = {
    nombre: nombre,
    items: CART.map(c => ({ perfume: c.name, cantidad: c.cantidad }))
  };

  try{
    await fetch(CART_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    document.getElementById('thanksMsg').textContent = '¡Pedido enviado! Te vamos a contactar para coordinar.';
  }catch(err){
    document.getElementById('thanksMsg').textContent = 'Hubo un problema de conexión. Probá de nuevo en un rato.';
  }

  submitBtn.disabled = false;
  submitBtn.textContent = 'Enviar pedido';
  closeOverlay('formOverlay');
  openOverlay('thanksOverlay');

  CART = [];
  saveCart();
  updateCartBadge();
  document.getElementById('nombreApellido').value = '';
});

document.getElementById('thanksCloseBtn').addEventListener('click', () => closeOverlay('thanksOverlay'));

loadCart();
updateCartBadge();
</script>
</body>
</html>
